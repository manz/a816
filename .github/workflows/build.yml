on:
  pull_request:
  push:
    branches:
      - 'master'
    tags-ignore:
      - v*
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # 3.14t runs the workspace index parse fan-out with real threads,
        # which the GIL build cannot exercise.
        python-version: ['3.14', '3.14t']
    env:
      HATCH_PYTHON: python${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v7
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install hatch
      run: pip install -r requirements.txt
    - name: Type check
      run: hatch run tests:type
    - name: Style check
      run: hatch run tests:check
    - name: Run tests
      run: hatch run tests:coverage
    - name: SonarCloud Scan
      if: matrix.python-version == '3.14'
      uses: SonarSource/sonarqube-scan-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
