on:
  push:
    tags:
      - 'v*'

jobs:
  pypi:
    name: Publish wheel to PyPI
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install hatch
        run: pip install -r requirements.txt
      - name: Publish wheel
        run: make publish
        env:
          HATCH_INDEX_AUTH: ${{ secrets.HATCH_INDEX_AUTH }}
          HATCH_INDEX_USER: ${{ secrets.HATCH_INDEX_USER }}
          VERSION: ${{ github.ref_name }}

  release:
    name: Create GitHub release
    # The Windows binary is built on demand (windows.yml), then attached here.
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes)
          # A PEP 440 pre-release: v1.2a1, v1.2.0b2, v1.2rc1.
          if [[ "$VERSION" =~ ^v[0-9]+(\.[0-9]+)*[.-]?(a|b|rc)[.-]?[0-9]*$ ]]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" "${args[@]}"
