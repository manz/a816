on:
  push:
    tags:
      - 'v*'

jobs:
  pypi:
    name: Publish wheel to PyPI
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install hatch
        run: pip install -r requirements.txt
      - name: Publish wheel
        run: make publish
        env:
          HATCH_INDEX_AUTH: ${{ secrets.HATCH_INDEX_AUTH }}
          HATCH_INDEX_USER: ${{ secrets.HATCH_INDEX_USER }}
          VERSION: ${{ github.ref_name }}

  binaries:
    name: Build Windows binary and create GitHub release
    # Pre-release tags (vX.Y.ZaN / bN / rcN) skip the ~6 min Nuitka build.
    if: ${{ !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install hatch
        run: pip install -r requirements.txt
      - name: Build binary and publish release
        run: make binary-release
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}

  prerelease:
    name: Create GitHub pre-release
    if: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-26.04
    steps:
      - name: Create pre-release with generated notes
        run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
