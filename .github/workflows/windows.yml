name: Windows binary

# On demand: the Nuitka build takes minutes, so releases don't wait for it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach a816.zip to (e.g. v1.1.7)
        required: true

jobs:
  binary:
    name: Build Windows binary and attach it to the release
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install hatch
        run: pip install -r requirements.txt
      - name: Build binary and attach it
        run: make binary-release
        env:
          VERSION: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
