[project]
name = "a816"
description = "65c816 patching assembler (Super Famicom)"
authors = [{ name = "Emmanuel Peralta", email = "manz@ringum.net" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"

keywords = ["super famicom", "supernes", "assembly", "romhack"]

classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
]

dependencies = ["pygls>=2.1.1,<3", "lsprotocol>=2025.0.0,<2026"]

dynamic = ["version"]

[tool.hatch.version]
source = "code"
path = "hatch_version.py"
expression = "get_version()"

[tool.hatch.build.targets.wheel]
only-include = ["a816", "script"]
sources = ["."]

[project.urls]
homepage = "https://a816.ringum.net"
repository = "https://github.com/manz/a816"

[project.scripts]
x816 = "a816.cli:cli_main"
a816 = "a816.cli:cli_main"
xdds = "a816.xdds:xdds_main"
xobj = "a816.xobj:main"
a816-lsp-server = "a816.lsp.server:lsp_main"
a816-fluff = "a816.fluff:fluff_legacy_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "kintsuki>=0.0.0a14",
]

[tool.ruff]
# What `ruff check` and `ruff format` cover, shared by tests:check and tests:format.
include = ["a816/**/*.py", "script/**/*.py", "tests/**/*.py"]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".mypy_cache",
    ".hatch",
    ".github",
    ".coverage",
    "build",
    "dist",
]

# Same as Black.
line-length = 120
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.coverage.run]
relative_files = true
# One root, so `coverage.xml` names every file from the repository root:
# with `--cov=a816 --cov=script` both `__init__.py` came out as `__init__.py`
# and SonarCloud couldn't place either (0% on any script/__init__.py change).
include = ["a816/*", "script/*"]

# Environments

[tool.hatch.envs.tests]
detached = true
dependencies = ["pygls>=2.1.1,<3", "lsprotocol>=2025.0.0,<2026", "pytest", "pytest-cov", "pytest-asyncio", "mypy", "ruff==0.17.0", "kintsuki>=0.0.0a14", "diff-cover"]

[tool.hatch.envs.tests.scripts]
coverage = "pytest --cov-report term --cov-report xml --cov --cov-branch tests"
diffcov = [
    "coverage",
    "diff-cover coverage.xml --compare-branch=origin/master --fail-under=80",
]

tests = "pytest tests"
check = ["ruff check", "ruff format --check"]
format = [
    "ruff check --fix",
    "ruff format",
    "check",
]

type = "mypy -p a816 -p script -p tests --strict --show-error-codes"

all = ["check", "type", "coverage"]

[tool.hatch.envs.binary]
detached = true
dependencies = ["nuitka"]

[tool.hatch.envs.binary.scripts]
build = [
    "nuitka --assume-yes-for-downloads --onefile a816/cli.py  --product-name=a816  --product-version=1.0.0 --company-name=ManZ --output-filename=x816 --no-deployment-flag=self-execution",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
